<!doctype html>
<html lang="de-AT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Umsatzplanner · Anmelden</title>
<style>
@font-face{font-family:"Figtree";font-style:normal;font-weight:300 900;font-display:swap;src:url(/figtree.woff2) format("woff2")}
:root{--bg:#F7F5F0;--card:#FFFFFF;--ink:#1E1C18;--muted:#6A655C;--line:rgba(30,28,24,.09);--accent:#FFC94D;--accent-ink:#1E1C18;--accent-text:#7A5200;--ok:#1A6B3B;--bad:#B02B21;--soft:#F2EFE8;
  --schatten:0 1px 2px rgba(30,28,24,.04),0 10px 28px rgba(30,28,24,.07);--ein:cubic-bezier(.2,.8,.2,1)}
@media (prefers-color-scheme: dark){:root{--bg:#151412;--card:#211F1C;--ink:#F4F0E8;--muted:#ADA69A;--line:rgba(255,255,255,.09);--accent-text:#FFC94D;--ok:#5FCB8D;--bad:#FF8073;--soft:#2C2A26;--schatten:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 80%,var(--ink));outline-offset:2px}
@keyframes rein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blende{from{opacity:0}to{opacity:1}}
main{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.card{width:100%;max-width:400px;background:var(--card);border-radius:28px;padding:28px;box-shadow:var(--schatten);animation:rein .22s var(--ein) both}
h1{font-size:23px;margin:0 0 22px;display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px;padding-left:6px}
input{width:100%;font:inherit;padding:12px 16px;min-height:52px;border:0;border-radius:20px;background:var(--soft);color:var(--ink);margin-bottom:14px}
button{width:100%;font:inherit;font-weight:700;min-height:52px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);cursor:pointer;margin-top:6px;transition:transform .12s var(--ein)}
button:active{transform:scale(.97)}
button:disabled{opacity:.6}
#fehler{color:var(--bad);font-weight:600;min-height:24px;margin:14px 0 0;font-size:15px;text-align:center}
@media (prefers-reduced-motion: reduce){.card{animation-name:blende}button:active{transform:none}}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1><svg width="32" height="32" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="15" fill="#FFC94D"/><rect x="8" y="15" width="3.6" height="7" rx="1.8" fill="#1E1C18"/><rect x="13.2" y="11" width="3.6" height="11" rx="1.8" fill="#1E1C18"/><rect x="18.4" y="7.5" width="3.6" height="14.5" rx="1.8" fill="#1E1C18"/></svg>Umsatzplanner</h1>
    <form id="f" novalidate>
      <label for="name">Benutzername</label>
      <input id="name" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="pw">Passwort</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button id="los" type="submit">Anmelden</button>
      <div id="fehler" role="alert"></div>
    </form>
  </div>
</main>
<script>
const f=document.getElementById("f"), los=document.getElementById("los"), fehler=document.getElementById("fehler");
f.addEventListener("submit",async e=>{
  e.preventDefault(); fehler.textContent="";
  const name=document.getElementById("name").value.trim(), passwort=document.getElementById("pw").value;
  if(!name||!passwort){ fehler.textContent="Bitte Benutzername und Passwort eingeben."; return; }
  los.disabled=true; los.textContent="Einen Moment …";
  try{
    const r=await fetch("/api/login",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json","x-umsatzplanner":"1"},body:JSON.stringify({name,passwort})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){ location.href="/"; return; }
    fehler.textContent=j.fehler||"Anmelden hat nicht geklappt.";
  }catch(err){ fehler.textContent="Keine Verbindung. Bitte Internet prüfen."; }
  los.disabled=false; los.textContent="Anmelden";
});
document.getElementById("name").focus();
</script>
</body>
</html>
